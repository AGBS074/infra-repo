apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-devops
  template:
    metadata:
      labels:
        app: hello-devops
    spec:
      containers:
      - name: hello-devops
        image: agbs074/hello-devops:d3ce9939033f07a70d350a7a68a526fbfa140d42
        ports:
        - containerPort: 5000

